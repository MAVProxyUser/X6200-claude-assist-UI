# X6200 (rtw88, the RTL8723DU): its own clocks' lines at 2457.6 and 2470.6 MHz (10 x 245.76 MHz; the second's source
# not known), inside WiFi channel 11, notched in the WiFi chip's receiver on the channels they fall in
# (buildroot/x6200/rtw88 0004). Measured 2026-11-21 with a HackRF beside the radio, on against off; on channel 11 a
# 3 Mbit/s TCI stream got 33 % of real time without the notch and 100 % with it. A driver without the option says
# "unknown parameter" and loads as before; the X6100 has no rtw_8723d
options rtw_8723d host_spur_khz=2457600,2470614
