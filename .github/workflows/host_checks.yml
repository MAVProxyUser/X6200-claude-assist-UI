# Every host check of the repository (tools/host_checks.sh, upstream #46): each tools/*/ test built and run on
# Linux, with what they need from outside the repository at the radio's own versions (liquid-dsp 1.4.0 and ft8_lib at
# tools/cross_x6200/setup.sh's revision). A check that does not build fails the job as a failing case does, and the
# table tells them apart (BUILD against FAIL); the ones that need a buildroot tree are SKIP here, each saying what, and
# run in the image build (main.yml, "Host checks with the image's tree": gps, hw_x6200, wifi_restore); the updater's in
# updater.yml. Minutes.
name: Host checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    # The checks take about 18 minutes and the setup 3; 60 leaves room for a slow mirror on a run with nothing kept
    # (2026-11-19: Ubuntu's took 23 minutes over the packages and the job hit the old 40)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true        # LVGL: the checks of the GUI's own files build against its headers

      - name: x6x00-df at its latest (its own repository, a submodule that follows its main)
        run: git submodule update --init --remote tools/rtlspec/x6x00-df

      - name: v0.3.8, which tools/data_partition compares the boot script with
        run: git fetch -q --no-tags --depth=1 origin +refs/tags/v0.3.8:refs/tags/v0.3.8

      # The packages Ubuntu's mirror gave, kept between runs: on 2026-11-19 it took 23 minutes over them (45 s as a rule)
      # and the job ran out of time. A run with them kept downloads only what is newer; the key changes with this file,
      # and the last run's packages come back for a new key too
      - name: Ubuntu's packages, kept between runs
        id: apt-kept
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/openx6x00/apt
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/host_checks.yml') }}
          restore-keys: apt-${{ runner.os }}-

      # The network steps tried again on a failure: a mirror's or GitHub's hiccup failed the run before any check.
      # apt keeps what it downloads in the folder above (its own archives folder may be cleaned by the runner image)
      - name: Libraries
        run: |
          A=$HOME/.cache/openx6x00/apt
          mkdir -p "$A/partial"
          for i in 1 2 3; do sudo apt-get update -q -o Acquire::Retries=3 && break; sleep 20; done
          for i in 1 2 3; do sudo apt-get install -y -q -o Acquire::Retries=3 -o Dir::Cache::Archives="$A" \
            -o APT::Keep-Downloaded-Packages=true \
            build-essential autoconf automake libtool cmake ninja-build pkg-config \
            libsqlite3-dev sqlite3 libxkbcommon-dev libnm-dev libpng-dev libasound2-dev python3-bottle python3-numpy \
            fdisk util-linux parted dosfstools exfatprogs bsdextrautils network-manager dbus iproute2 \
            libsdl2-dev libdrm-dev libdbus-glib-1-dev libsndfile1-dev libudev-dev libpulse-dev libjpeg-dev \
            libglib2.0-dev libboost-dev && break; sleep 20; [ $i = 3 ] && exit 1; done
          sudo rm -rf "$A/partial" "$A/lock"
          sudo chown -R "$(id -u):$(id -g)" "$A"
          echo "packages kept: $(ls "$A" | wc -l) ($(du -sh "$A" | cut -f1))"

      # Kept as soon as they are in, not at the job's end: a check that fails later still leaves them for the next run
      - name: Ubuntu's packages kept for the next run
        if: steps.apt-kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/openx6x00/apt
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/host_checks.yml') }}

      # As host/build.sh's deps(), in /usr/local (DEPS below): liquid-dsp and ft8_lib at the radio's versions
      - name: liquid-dsp, the radio's version
        run: |
          VER=$(sed -n 's/^LIQUID_VER=\([0-9.]*\).*/\1/p' tools/cross_x6200/setup.sh)
          for i in 1 2 3; do rm -rf /tmp/liquid-dsp; git clone -q --depth 1 --branch "v$VER" \
            https://github.com/jgaeddert/liquid-dsp.git /tmp/liquid-dsp && break; sleep 20; [ $i = 3 ] && exit 1; done
          cd /tmp/liquid-dsp && ./bootstrap.sh > /dev/null && ./configure -q && make -j"$(nproc)" > /dev/null
          sudo make install > /dev/null && sudo ldconfig

      - name: ft8_lib, the radio's revision
        run: |
          REV=$(sed -n 's/^FT8LIB_REV=\([0-9a-f]*\).*/\1/p' tools/cross_x6200/setup.sh)
          for i in 1 2 3; do rm -rf /tmp/ft8_lib; git clone -q https://github.com/gdyuldin/ft8_lib.git /tmp/ft8_lib \
            && break; sleep 20; [ $i = 3 ] && exit 1; done
          git -C /tmp/ft8_lib checkout -q "$REV"
          make -C /tmp/ft8_lib lib CFLAGS="-O2 -fPIC -D_GNU_SOURCE" LDFLAGS="-lm" > /dev/null
          sudo mkdir -p /usr/local/include/ft8lib
          sudo cp /tmp/ft8_lib/.build/libft8.so /usr/local/lib/ && sudo cp /tmp/ft8_lib/ft8/*.h /usr/local/include/ft8lib/
          sudo ldconfig

      # The PC build's LVGL and its SDL drivers (build-host/lib, as host/build.sh leaves them): the checks that link
      # the GUI's own files against them (cw_kbd, text_popup, tci_ask...). Configured as host/build.sh does, only
      # those two built
      - name: LVGL and lv_drivers, the PC build's
        run: |
          cmake -S . -B build-host -G Ninja -DHOST_BUILD=ON -DHOST_DEPS=/usr/local -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            > /dev/null
          cmake --build build-host --target lvgl lv_drivers > /dev/null
          ls -l build-host/lib/liblvgl.a build-host/lib/liblv_drivers.a

      # Ubuntu 24.04 keeps unprivileged user namespaces from writing their uid_map: tools/wifi_restore,
      # tools/wifi_steady and tools/smartcw run NetworkManager in namespaces of their own (unshare -rmn)
      - name: User namespaces for the WiFi checks
        run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0

      # RADE (rade_c, Opus with FARGAN and its model data) for tools/freedv_text and the FreeDV checks: built here, out
      # of the checks' 300 s each, and kept between runs. Downloaded and built inside freedv_text it ran past 300 s
      # when the downloads were slow (run 43908520547)
      - name: RADE, kept between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/openx6x00/rade
          key: rade-${{ runner.os }}-${{ hashFiles('tools/rade/**') }}

      - name: RADE built
        run: tools/rade/build.sh > /dev/null

      - name: Host checks
        env:
          DEPS: /usr/local                 # liquid-dsp and libft8, where the checks' Makefiles look (DEPS)
          FT8LIB: /tmp/ft8_lib             # ft8_lib's sources (tools/ft8_contest)
          FT8LIB_INC: /usr/local/include
        run: tools/host_checks.sh
